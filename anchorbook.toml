schema-version = 1

[project]
phase = "prototyping"

[book]
source = "anchor-book/src"
output = "target/anchorbook"
mdbook = "anchor-book/book.toml"

[book.sections]
design = "design/index.md"
authority = "authority/index.md"
implementation-roadmaps = "implementation-roadmaps/index.md"

[verification]
sources = [
  "src", "tests", "symposium-eval/src", "symposium-testlib/src",
  "symposium-install/src", "symposium-sdk/src", "symposium-pm-cargo/src", "xtask/src",
]
output = "target/anchorbook-verify"
runners = ["nextest"]
